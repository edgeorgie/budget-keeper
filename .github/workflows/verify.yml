name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Scope is the FULL tree, not the `--omit=dev` scope the siblings use. On the
      # tree this fixed, `--omit=dev --audit-level=high` exited 0 while three
      # critical advisories were live in the dev tree (GHSA-5gmw-xhrv-c9v3,
      # GHSA-85c8-ppgw-ccpr, GHSA-5xrq-8626-4rwp — npm's summary says "2 critical"
      # because it counts packages, not advisories). Dev code runs here and on
      # maintainer machines. Affordable at 41 packages; siblings narrow because
      # their dev subtrees are larger.
      #
      # Moderate findings do not block (measured: moderate-only tree exits 0 here,
      # 1 at `--audit-level=moderate`); they ride the weekly Dependabot PR.
      #
      # If an advisory has no patched version, Dependabot has no bump to offer and
      # `npm audit` has no allowlist flag: drop the dependency, or add `--omit=dev`
      # here with the GHSA and reason (verified to green a dev-scoped unpatchable).
      - name: Audit dependencies
        run: npm audit --audit-level=high

      # Typecheck, test and build are separate steps so a red run names which
      # gate failed rather than collapsing into one opaque "npm run ci" failure.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The tests must not reach the network or spend money. Running the suite
      # with the credentials explicitly stripped proves the governor's properties
      # are verified against the deterministic simulator and cannot silently
      # start billing a real provider in CI.
      - name: Test with credentials stripped
        env:
          ANTHROPIC_API_KEY: ""
          GITHUB_TOKEN: ""
        run: npm test

      # The CLI must work end to end with no credentials at all. `--help` exits 2
      # by design, so this asserts the real scan path against the live GitHub API
      # instead, with the run's own budget gate as the cost ceiling.
      - name: Smoke-test the CLI against a real repository
        run: node --experimental-strip-types src/cli.ts --repo expressjs/express --budget 0.01
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
